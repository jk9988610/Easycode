name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Windows runner 贴近实际开发环境；typecheck + 纯函数测试跨平台无差异
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
        env:
          # CI 只跑 typecheck + vitest，不需要 electron 二进制，省下载时间
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
